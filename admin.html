<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>إدارة أساس</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#E84A84;--pink2:#FFF0F5;--ink:#22202B;--mut:#7B7785;--line:#ECE3E8;--bg:#FFF8F4;--ok:#2E8B57;--font:'Baloo Bhaijaan 2',Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px #FFC93C}
.top b{font-size:19px;flex:1}.top b span{color:var(--pink)}
.top button{border:0;background:none;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:800;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;font-size:15px;margin-bottom:10px}
.add{width:100%;border:0;background:var(--pink);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:12px;box-shadow:0 8px 18px -10px rgba(232,74,132,.8)}
.it{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:8px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;width:100%;text-align:right}
.it img,.it .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#F4EEF1;display:grid;place-items:center;font-size:22px}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .t small{color:var(--mut);font-weight:600;font-size:12.5px}
.it .pr{font-weight:800;color:var(--pink);white-space:nowrap;font-size:14px}
.hid{background:#EEE;color:#666;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;margin-inline-start:4px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(34,32,43,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.card{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.card h2{margin:4px 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.card h2 button{border:0;background:#F4EEF1;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
label.f{display:block;margin-bottom:12px;font-weight:700;font-size:14px}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;font-weight:500}
label.f small{display:block;color:var(--mut);font-weight:600;font-size:12px;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px;cursor:pointer}
.chips button.on{border-color:var(--pink);background:var(--pink2);color:var(--pink)}
.img{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.img .pv{width:96px;height:96px;border-radius:16px;background:#F4EEF1 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:30px;border:1.5px dashed #D9CBD2}
.img label{flex:1;border:1.5px solid var(--pink);color:var(--pink);background:var(--pink2);border-radius:14px;padding:12px;text-align:center;font-weight:800;cursor:pointer}
.img input{display:none}
.pk{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px;font-weight:600;font-size:14px;cursor:pointer}
.pk input{width:20px;height:20px;accent-color:var(--pink)}
.tg{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.tg input{width:22px;height:22px;accent-color:var(--ok)}
.save{width:100%;border:0;background:var(--ink);color:#fff;border-radius:16px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px}
.save:disabled{opacity:.6}
.msg{color:#C0392B;font-weight:700;font-size:14px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.login{max-width:380px;margin:12vh auto 0;background:#fff;border-radius:22px;padding:22px;text-align:center;border:1px solid var(--line)}
.login img{width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 3px #FFC93C}
.login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:17px;text-align:center;margin:14px 0 10px;direction:ltr}
.empty{color:var(--mut);text-align:center;padding:30px 0;font-weight:600}
.load{color:var(--mut);text-align:center;padding:40px 0;font-weight:700}
.note{background:#FFF7E0;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;color:#6B5A1E;margin-bottom:12px;line-height:1.7}
</style></head><body>
<div id="app"></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<script>
const HOOK='https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let KEY=store.get('asas-admin')||'',D=null,tab='products',q='',F=null;
const img=u=>{u=String(u||'');if(!u||u==='(data)')return '';const m=u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400':u};
const money=v=>{const n=Number(v);return isNaN(n)?'':(Math.round(n*1000)/1000).toString()};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(body){
  const r=await fetch(HOOK,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'admin',key:KEY,...body})});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error('السكربت ما رد صح. تأكدي إنك حدثتيه')}
  if(j.error==='denied'){store.del('asas-admin');KEY='';render();throw new Error('كلمة السر غلط')}
  if(j.error)throw new Error(j.error);return j}

function render(){
  const app=$('#app');
  if(!KEY){app.innerHTML=`<div class="login"><img src="img/delivery/d_logo.webp" onerror="this.src='favicon.png'" alt=""><h2 style="margin:12px 0 0">إدارة متجر أساس</h2><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button class="save" id="go">دخول</button><p class="msg" id="lm"></p></div>`;
    const go=async()=>{KEY=$('#pw').value.trim();if(!KEY)return;$('#go').disabled=true;$('#go').textContent='لحظة…';try{await api({action:'ping'});store.set('asas-admin',KEY);render();load()}catch(e){KEY='';$('#lm').textContent=e.message;$('#go').disabled=false;$('#go').textContent='دخول'}};
    $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};return}
  app.innerHTML=`<div class="top"><img src="img/delivery/d_logo.webp" onerror="this.src='favicon.png'" alt=""><b>إدارة <span>أساس</span></b><button id="out">خروج</button></div>
  <div class="tabs"><button data-tab="products" class="${tab==='products'?'on':''}">🛍️ المنتجات</button><button data-tab="packs" class="${tab==='packs'?'on':''}">🎁 البكجات</button></div>
  <main id="main"></main>`;
  $('#out').onclick=()=>{store.del('asas-admin');KEY='';D=null;render()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';render()});
  drawList()}

function drawList(){
  const m=$('#main');if(!m)return;
  if(!D){m.innerHTML='<div class="load">جاري تحميل المنتجات…</div>';return}
  const L=(tab==='products'?D.products:D.packs).filter(x=>!q||x.name.includes(q)).slice().reverse();
  m.innerHTML=`<button class="add" id="new">＋ ${tab==='products'?'منتج جديد':'بكج جديد'}</button>
  <input class="search" id="q" placeholder="ابحثي بالاسم" value="${esc(q)}">
  ${L.map(x=>`<button class="it" data-row="${x.row}">${img(x.image)?`<img src="${esc(img(x.image))}" alt="" loading="lazy">`:`<span class="ph">${tab==='products'?'🛍️':'🎁'}</span>`}<span class="t"><b>${esc(x.name)}${x.shown?'':'<span class="hid">مخفي</span>'}</b><small>${tab==='products'?esc(x.unit||'حبة'):(x.file?'📁 الملف مربوط':'⚠️ بدون ملف')}${tab==='packs'?' · '+x.addons.length+' ملحق':''}</small></span><span class="pr">${money(x.price)} ر.ع</span></button>`).join('')||'<div class="empty">ما فيه شي</div>'}`;
  $('#new').onclick=()=>openForm(null);
  const qi=$('#q');qi.oninput=()=>{q=qi.value.trim();const p=qi.selectionStart;drawList();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  m.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>openForm(+b.dataset.row))}

async function load(){try{D=await api({action:'list'});drawList()}catch(e){if(KEY){$('#main')&&($('#main').innerHTML='<div class="load">'+esc(e.message)+'<br><br><button class="save" onclick="load()" style="max-width:200px">حاولي مرة ثانية</button></div>')}}}

const UNITS=['حبة','درزن','ورقة','شيت','طقم'];
function openForm(row){
  const isP=tab==='products';
  const src=row?(isP?D.products:D.packs).find(x=>x.row===row):null;
  F=isP?{row:row||0,name:src?src.name:'',price:src?money(src.price):'',unit:src?src.unit||'حبة':'حبة',options:src?src.options:'',image:src?src.image:'',shown:src?src.shown:true,
      packs:src?D.packs.filter(p=>p.addons.includes(src.name)).map(p=>p.name):[]}
     :{row:row||0,name:src?src.name:'',short:src?src.short:'',price:src?money(src.price):'',badge:src?src.badge:'',image:src?src.image:'',shown:src?src.shown:true,file:src?src.file:''};
  drawForm();$('#sheet').hidden=false}
function drawForm(){
  const isP=tab==='products',c=$('#card'),pv=img(F.image)||(F.image==='(data)'?'':''),hasData=F.image==='(data)';
  c.innerHTML=`<h2>${F.row?'تعديل':'إضافة'} ${isP?'منتج':'بكج'}<button id="x" aria-label="إغلاق">✕</button></h2>
  <div class="img"><div class="pv" id="pv" style="${pv?`background-image:url('${esc(pv)}')`:''}">${pv?'':(hasData?'🖼️':'📷')}</div><label>${F.image?'تغيير الصورة':'إضافة صورة'}<input type="file" accept="image/*" id="file"></label></div>
  <label class="f">الاسم<input id="f-name" value="${esc(F.name)}" placeholder="${isP?'مثال: علبة هدايا بثيم اليوم الوطني 🇴🇲':'مثال: بكج عمان عز وفخر'}"></label>
  ${isP?`<div class="row2"><label class="f">السعر (ر.ع)<input id="f-price" inputmode="decimal" value="${esc(F.price)}" placeholder="1.5"></label>
    <label class="f">الوحدة<input id="f-unit" value="${esc(F.unit)}"></label></div>
    <div class="chips" style="margin:-6px 0 12px">${UNITS.map(u=>`<button type="button" data-u="${u}" class="${F.unit===u?'on':''}">${u}</button>`).join('')}</div>
    ${F.unit.includes('درزن')?'<p class="note" style="margin-top:-4px">💡 حطي سعر الدرزن كامل، والموقع يقسمه على ١٢ والزبونة تختار أي عدد.</p>':''}
    <label class="f">الأنواع (اختياري)<textarea id="f-opt" rows="2" placeholder="أحمر، أخضر، أبيض">${esc(F.options)}</textarea><small>افصلي بينها بفاصلة «،». خليها فاضية إذا ما فيه أنواع.</small></label>
    <div class="f" style="font-weight:700;font-size:14px;margin-bottom:12px">يطلع مع البكج:${D.packs.map(p=>`<label class="pk"><input type="checkbox" data-pk="${esc(p.name)}" ${F.packs.includes(p.name)?'checked':''}>${esc(p.name)}</label>`).join('')}</div>`
  :`<label class="f">الوصف المختصر<input id="f-short" value="${esc(F.short)}" placeholder="مثال: ١٤ قالب مميز"></label>
    <div class="row2"><label class="f">السعر (ر.ع)<input id="f-price" inputmode="decimal" value="${esc(F.price)}" placeholder="4"></label>
    <label class="f">الشارة<input id="f-badge" value="${esc(F.badge)}" placeholder="نوفمبر المجيد 🇴🇲"></label></div>
    <label class="f">رابط ملف الكاميو (من الدرايف)<input id="f-file" dir="ltr" value="${esc(F.file)}" placeholder="https://drive.google.com/..."><small>افتحي الملف أو المجلد في الدرايف ← مشاركة ← نسخ الرابط. يصير مفتوح بالرابط بروحه، ويروح للزبونة بعد تأكيد الطلب.</small></label>`}
  <label class="tg">ظاهر في الموقع<input type="checkbox" id="f-shown" ${F.shown?'checked':''}></label>
  <p class="msg" id="fm"></p>
  <button class="save" id="sv">حفظ</button>`;
  $('#x').onclick=closeForm;
  const sync=()=>{const g=id=>{const e=$('#'+id);return e?e.value:undefined};F.name=g('f-name');F.price=g('f-price');if(isP){F.unit=g('f-unit');F.options=g('f-opt');F.packs=[...c.querySelectorAll('[data-pk]')].filter(x=>x.checked).map(x=>x.dataset.pk)}else{F.short=g('f-short');F.badge=g('f-badge');F.file=g('f-file')}F.shown=$('#f-shown').checked};
  c.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{sync();F.unit=b.dataset.u;drawForm()});
  $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;sync();const p=$('#pv');p.textContent='⏳';p.style.backgroundImage='';$('#sv').disabled=true;$('#sv').textContent='جاري رفع الصورة…';
    try{const b64=await shrink(f);p.style.backgroundImage=`url('data:image/jpeg;base64,${b64}')`;const r=await api({action:'upload',b64,mime:'image/jpeg',name:(F.name||'صورة').slice(0,40)});F.image=r.url;p.textContent='';toast('ارتفعت الصورة ✅')}
    catch(err){p.textContent='⚠️';$('#fm').textContent='ما ارتفعت الصورة: '+err.message}
    $('#sv').disabled=false;$('#sv').textContent='حفظ'};
  $('#sv').onclick=async()=>{sync();const fm=$('#fm');fm.textContent='';
    if(!String(F.name||'').trim())return fm.textContent='اكتبي الاسم';
    const pr=parseFloat(String(F.price||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,''));if(isNaN(pr))return fm.textContent='اكتبي السعر رقم';
    const sv=$('#sv');sv.disabled=true;sv.textContent='جاري الحفظ…';
    try{await api(isP?{action:'saveProduct',row:F.row,name:F.name.trim(),price:pr,unit:(F.unit||'حبة').trim(),options:F.options||'',image:F.image||'',shown:F.shown,packs:F.packs}
                 :{action:'savePack',row:F.row,name:F.name.trim(),short:F.short||'',price:pr,badge:F.badge||'',image:F.image||'',shown:F.shown,file:F.file||''});
      toast('انحفظ ✅ يبين في الموقع خلال دقيقة');closeForm();D=null;drawList();load()}
    catch(err){fm.textContent=err.message;sv.disabled=false;sv.textContent='حفظ'}}}
function closeForm(){$('#sheet').hidden=true;F=null}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeForm()};
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('ما قدرت أقرا الصورة'));r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('الصورة مب مدعومة'));im.onload=()=>{const M=1200,s=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.85).split(',')[1])};im.src=r.result};r.readAsDataURL(file)})}
render();if(KEY)load();
</script></body></html>
