name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null 2>&1
          cat > t.js <<'JS'
          const pw=require('playwright');(async()=>{const b=await pw.webkit.launch();const c=await b.newContext({...pw.devices['iPhone 13']});const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message+' @'+(e.stack||'').split('\n')[1]));p.on('console',m=>{if(m.type()==='error')errs.push('C:'+m.text())});
          await p.goto('https://assas-oman.com/admin.html?x='+Date.now());await p.waitForTimeout(3000);
          console.log('RES1 app',await p.evaluate(()=>document.getElementById('app').innerHTML.length));
          await p.fill('#pw','pzjsn5es').catch(e=>console.log('RES nofill'));await p.click('#go').catch(()=>{});await p.waitForTimeout(15000);
          console.log('RES2 app',await p.evaluate(()=>document.getElementById('app').innerText.slice(0,300).replace(/\n/g,' | ')));
          await p.reload();await p.waitForTimeout(8000);
          console.log('RES3 app',await p.evaluate(()=>document.getElementById('app').innerText.slice(0,200).replace(/\n/g,' | ')));
          console.log('RES4 errs',JSON.stringify(errs).slice(0,1500));await b.close()})();
          JS
          node t.js
