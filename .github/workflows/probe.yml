name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "RES1 $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://assas-oman.com/manifest.webmanifest)"
          echo "RES2 $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://assas-oman.com/admin.webmanifest)"
          echo "RES3 $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://assas-oman.com/sw.js)"
          echo "RES4 $(curl -s https://assas-oman.com/admin.html | grep -o 'rel="manifest"[^>]*' | head -1)"
          echo "RES5 $(curl -s https://assas-oman.com/ | grep -o 'apple-mobile-web-app-capable[^>]*' | head -1)"
          echo "RES6 $(curl -s -o /dev/null -w '%{http_code}' https://assas-oman.com/img/app/admin-apple-180.png)"
