name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H='https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec'
          R=$(curl -sL "$H?admin=ping&key=pzjsn5es"); echo "RES1 $R"
          if echo "$R" | grep -q '"v":13'; then
            curl -sL -H 'Content-Type: text/plain' -d '{"type":"admin","key":"pzjsn5es","action":"orders","limit":600}' "$H" | python3 -c "
          import sys,json,collections;d=json.load(sys.stdin)
          if d.get('error'):print('RES2 ERR',d['error']);sys.exit()
          o=d['orders'];print('RES2 orders',len(o),'couriers',[c['name'] for c in d['couriers']],'files',len(d['files']),'quota',d['quota'])
          print('RES3',collections.Counter(x['status'][:22] for x in o).most_common(12))
          print('RES4',[(x['ref'],x['name'],x['status']) for x in o if x['status'] in ('جديد',) ][-12:])"
          fi
