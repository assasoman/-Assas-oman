name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd .github/tmp && (python3 -m http.server 8000 >/dev/null 2>&1 &) && cd ../..
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'J'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto('http://localhost:8000/ocr.html');const t0=Date.now();const r=await p.evaluate(()=>run());console.log('OCR_MS',Date.now()-t0);console.log('OCR_TEXT',JSON.stringify(r));await b.close()})()
          J
          node t.js
