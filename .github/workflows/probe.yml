name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H='https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec'
          echo PING; curl -sL -H 'Content-Type: text/plain' -d '{"type":"admin","key":"pzjsn5es","action":"ping"}' "$H"; echo
          echo LIST; curl -sL -H 'Content-Type: text/plain' -d '{"type":"admin","key":"pzjsn5es","action":"list"}' "$H" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error') or ('products',len(d['products']),'packs',len(d['packs']),[(p['name'],p['file'][:30],len(p['addons'])) for p in d['packs']]))"
