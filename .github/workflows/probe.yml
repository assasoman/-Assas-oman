name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          { curl -sSL --max-time 30 "https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec?draw=tree2026&cb=t" | head -c 300; echo; curl -sSL --max-time 30 "https://assas-oman.com/lucky.html" | grep -o "AKfycb[A-Za-z0-9_-]\{12\}\|function jsonp\|tcd" | sort | uniq -c; curl -sSL "https://assas-oman.com/data/draw.json" | head -c 120; } > probe.txt
          git config user.name assas-bot; git config user.email assas-bot@users.noreply.github.com
          git add probe.txt; git commit -m probe; git push
