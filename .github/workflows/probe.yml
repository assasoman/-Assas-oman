name: probe
on: [push]
permissions:
  contents: write
jobs:
  p:
    if: contains(github.event.head_commit.message, 'probe-run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          H="https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec"
          { echo "A:"; curl -sSL --max-time 40 "$H?track=AQLW5C14&p=2170"; echo; echo "B:"; curl -sSL --max-time 40 "$H?track=AQLW5C14&p=0000"; echo; echo "C:"; curl -sSL --max-time 40 "$H?track=AQLW5C14&p=2170&cb=x"; echo; } > probe.txt 2>&1
          git config user.name assas-bot; git config user.email assas-bot@users.noreply.github.com
          git add probe.txt; git commit -m "probe result"; git push
