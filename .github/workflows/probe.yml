name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          H='https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec'
          IMG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
          post(){ curl -sL -H 'Content-Type: text/plain;charset=utf-8' --data-binary "$1" "$H"; echo; }
          order(){ post "{\"ref\":\"$1\",\"name\":\"$3\",\"phone\":\"9000$2\",\"wilaya\":\"اختبار\",\"email\":\"assasoman7@gmail.com\",\"summary\":\"بكج عمان عز وفخر × 1 (4 ر.ع)\",\"total\":\"$4\",\"discount\":\"\",\"coupon\":\"\",\"delivery\":\"\",\"files\":[]}" >/dev/null; }
          rc(){ echo "[$1 receipt] $(post "{\"type\":\"receipt\",\"ref\":\"$1\",\"ph\":\"$2\",\"img\":\"$IMG\",\"text\":\"$3\"}")"; }
          sms(){ echo "[$4 sms] $(post "{\"type\":\"bank\",\"key\":\"pzjsn5es\",\"text\":\"عزيزي الزبون، لقد استلمت OMR $1 من $2 في حسابك 0334XXXXXXXX0027 باستخدام خدمات الدفع عبر الهاتف النقال/ المحفظة الإلكترونية. . رقم المعاملة$3. رصيدك الحالي هو OMR.\"}")"; }
          NOW(){ TZ=Asia/Muscat date '+%H:%M:%S %d/%m/%Y'; }
          NOWAM(){ TZ=Asia/Muscat date '+%d/%m/%Y\n%I:%M:%S %p'; }
          echo "== A: بنك مسقط، الإيصال قبل الرسالة (المتوقع: يتأكد)"
          order TSTA0011 1111 'Test A' 0.011; rc TSTA0011 1111 "BMCT990000000011\nOMR 0.011\n$(NOWAM)"; sms 0.011 'TEST A' BMCT990000000011 A
          echo "== B: بنك مسقط، الرسالة قبل الإيصال (المتوقع: يتأكد)"
          order TSTB0012 2222 'Test B' 0.012; sms 0.012 'TEST B' BMCT990000000012 B; rc TSTB0012 2222 "BMCT990000000012\nOMR 0.012\n$(NOWAM)"
          echo "== C: بنك ثاني، الإيصال قبل الرسالة (المتوقع: يتأكد)"
          order TSTC0013 3333 'Test C' 0.013; rc TSTC0013 3333 "= 0.013\n92079057\n52820013\n$(NOW)"; sleep 3; sms 0.013 'TEST C' BNZWTESTCC13XY C
          echo "== D: بنك ثاني، الرسالة قبل الإيصال (المتوقع: يتأكد)"
          order TSTD0014 4444 'Test D' 0.014; T=$(NOW); sms 0.014 'TEST D' BNZWTESTDD14XY D; rc TSTD0014 4444 "= 0.014\n92079057\n52820014\n$T"
          echo "== E: غش، نفس إيصال A لطلب ثاني (المتوقع: مرفوض مكرر)"
          order TSTE0011 5555 'Test E' 0.011; rc TSTE0011 5555 "BMCT990000000011\nOMR 0.011\n$(NOWAM)"
          echo "== F: غش، نفس إيصال C (بنك ثاني) لطلب ثاني (المتوقع: مرفوض أو ما يتأكد)"
          order TSTF0013 6666 'Test F' 0.013; rc TSTF0013 6666 "= 0.013\n92079057\n52820013\n$(TZ=Asia/Muscat date -d '-5 sec' '+%H:%M:%S %d/%m/%Y')"
          echo "== G: إيصال بدون رسالة بنك (المتوقع: ينتظر)"
          order TSTG0015 7777 'Test G' 0.015; rc TSTG0015 7777 "= 0.015\n52820015\n$(NOW)"
          echo "== H: المبلغ في الرسالة غير (المتوقع: ما يتأكد)"
          order TSTH0016 8888 'Test H' 0.016; rc TSTH0016 8888 "= 0.016\n52820016\n$(NOW)"; sms 0.017 'TEST H' BNZWTESTHH17XY H
          echo "== I: بنك مسقط، رقم المعاملة مختلف (المتوقع: ما يتأكد)"
          order TSTI0018 9999 'Test I' 0.018; rc TSTI0018 9999 "BMCT990000000018\nOMR 0.018\n$(NOWAM)"; sms 0.018 'TEST I' BMCT990000000019 I
          echo "== J: رقم الهاتف غلط (المتوقع: مرفوض)"
          order TSTJ0019 1234 'Test J' 0.019; rc TSTJ0019 0000 "= 0.019\n$(NOW)"
          echo "== K: نفس رسالة البنك مرتين (المتوقع: مسجل من قبل)"
          sms 0.011 'TEST A' BMCT990000000011 K
