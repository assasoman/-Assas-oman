name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          H='https://script.google.com/macros/s/AKfycbyRaK36iO3v2H8EYav7cav-3jMJb8ODf5NdNOsoJB-H3uh7VYFFZ1s-ynOgeNbRe7II/exec'
          echo "PING $(curl -sL "$H?admin=ping&key=pzjsn5es")"
          python3 -c "import json;print(json.dumps({'type':'receipt','ref':'AW7PN090','ph':'9057','img':'data:image/jpeg;base64,'+open('.github/tmp/r.b64').read().strip()}))" > body.json
          echo "RCPT $(curl -sL -H 'Content-Type: text/plain' --data-binary @body.json "$H")"
          echo "LIST $(curl -sL -H 'Content-Type: text/plain' --data '{"type":"admin","key":"pzjsn5es","action":"transfers"}' "$H" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['receipts'][-1])")"
